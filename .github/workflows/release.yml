name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write # required to create a github release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # required for GoReleaser to accurately generate changelogs

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          # GitHub automatically provides this token representing the actions bot
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
